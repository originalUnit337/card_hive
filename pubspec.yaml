name: card_hive
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  barcode: ^2.2.9
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.1
  get_it: ^8.2.0
  go_router: ^16.2.1
  google_sign_in: ^7.2.0
  googleapis: ^15.0.0
  http: ^1.5.0
  image_picker: ^1.2.0
  json_annotation: ^4.9.0
  logger: ^2.6.1
  mobile_scanner: ^7.1.2
  objectbox: ^4.3.1
  objectbox_flutter_libs: any
  path_provider: ^2.1.5
  screen_brightness: ^2.1.7
  vector_graphics: ^1.1.19
  wakelock_plus: ^1.4.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.1
  mockito: ^5.0.0
  objectbox_generator: any


flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/bar_codes/
    - assets/logos/
    - assets/
