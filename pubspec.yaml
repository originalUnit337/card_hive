name: card_hive
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  barcode: ^2.2.9
  bloc: ^9.0.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  go_router: ^16.2.1
  image_picker: ^1.2.0
  logger: ^2.6.1
  mobile_scanner: ^7.1.2
  objectbox: ^4.3.1
  objectbox_flutter_libs: any
  screen_brightness: ^2.1.7
  wakelock_plus: ^1.4.0

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  objectbox_generator: any


flutter:
  uses-material-design: true
  assets:
    - assets/bar_codes/
    - assets/logos/
    - assets/
